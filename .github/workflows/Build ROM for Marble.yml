name: Build ROM for Marble (Forked)
on:
  workflow_dispatch:
    inputs:
      URL:
        description: "移植包下载地址"
        required: true
      VENDOR_URL:
        description: "底包下载地址"
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.5.0.VMRCNXM/marble-ota_full-OS2.0.5.0.VMRCNXM-user-15.0-360119838b.zip'
      IMAGE_TYPE:
        description: "IMAGE 格式"
        required: true
        default: 'erofs'
        type: choice
        options:
        - erofs
        - ext4
      EXT_RW:
        description: 'EXT4 可读写'
        required: true
        type: boolean
      DECRYPTION:
        description: '去除强制加密'
        required: true
        type: boolean
      PERFECTICON:
        description: '启用完美图标'
        required: true
        type: boolean
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化构建环境
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 检出构建脚本仓库 (Forked)
        uses: actions/checkout@main
        with:
          repository: FunnyShadow/HOS2-marble   # 修改这里指向你的 fork 仓库
          ref: android15                       # 确保你的 fork 中有这个分支
          token: ${{ secrets.PRIVATE_TOKEN }}    # 这个 token 需要有读取你 fork 仓库的权限

      - name: 准备所需环境
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip aria2 p7zip-full zstd fuse3

      - name: 构建 ROM
        id: build_rom
        run: |
          # 这个 make.sh 现在来自于你的 FunnyShadow/HOS2-marble 仓库
          sudo bash "$GITHUB_WORKSPACE"/make.sh \
            "${{ github.event.inputs.URL }}" \
            "${{ github.event.inputs.VENDOR_URL }}" \
            "${{ github.event.inputs.IMAGE_TYPE }}" \
            "${{ github.event.inputs.EXT_RW }}" \
            "${{ github.event.inputs.DECRYPTION }}" \
            "${{ github.event.inputs.PERFECTICON }}" \
            "$GITHUB_ENV" \
            "$GITHUB_WORKSPACE"
        continue-on-error: false

      - name: 检查构建结果并处理 ROM
        run: |
          if [ -z "${{ env.rom_name }}" ]; then
            echo "::error::构建脚本未设置 rom_name 环境变量！"
            exit 1
          fi
          if [ -z "${{ env.port_os_version }}" ]; then
            echo "::error::构建脚本未设置 port_os_version 环境变量！"
            exit 1
          fi
          ROM_ZIP_PATH="$GITHUB_WORKSPACE/zip/${{ env.rom_name }}"
          if [ ! -f "${ROM_ZIP_PATH}" ]; then
            echo "::error::构建后的 ROM zip 文件未在预期路径找到！"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE"/GithubRelease
          cd "$GITHUB_WORKSPACE"/GithubRelease
          sudo split -b 1536M -d "${ROM_ZIP_PATH}" ${{ env.rom_name }}.
          cd "$GITHUB_WORKSPACE"
          touch file.log
          echo -e "移植机型: ${{ env.model }}\n\n底包版本: ${{ env.vendor_os_version }}\n底包安全补丁版本: ${{ env.vendor_security_patch }}\n底包基线版本: ${{ env.origin_base_line}}\n底包vendor基线版本: ${{ env.vendor_base_line}}\n\n移植包版本: ${{ env.port_os_version }}\n移植包安全补丁版本: ${{ env.port_security_patch }}\n移植包基线版本: ${{ env.port_base_line }}" > file.log

      - name: 上传到 Github Release
        uses: ncipollo/release-action@main
        with:
          artifacts: ${{ github.workspace }}/GithubRelease/*
          name: ${{ env.port_os_version }}
          tag: ${{ env.port_os_version }}
          bodyFile: "${{ github.workspace }}/file.log"
          allowUpdates: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }} # 使用内置 Token 上传 Release 到你存放 Workflow 的仓库
